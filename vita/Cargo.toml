[package]
name = "pocket-tokyo-vita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Tokyo on PS Vita: the city through GXM at 60 frames per second, under the PocketJS interface"

# Vita-only binary built through cargo-vita (tools/tokyo.ts); excluded from
# the desktop workspace in the repository root.
[workspace]
resolver = "2"

[dependencies]
pocketjs-vita = { path = "../vendor/pocketjs/hosts/vita", default-features = false }
pocket-vita-gxm = { path = "../vendor/pocketjs/devices/vita/pocket-vita-gxm", features = ["runtime-compiler"] }
pocket3d-title = { path = "../vendor/pocketjs/engine/pocket3d/crates/pocket3d-title" }
tokyo-sim = { path = "../crates/tokyo-sim" }
tokyo-pack = { path = "../crates/tokyo-pack" }
# The interface (ui/): its protocol, the flow around a flight, and the channel the PocketJS guest opens in the process.
tokyo-interface = { path = "../crates/tokyo-interface", features = ["guest"] }
# The guest's collector is run by this runtime, at moments it chooses (`interface.rs`).
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
serde_json = "1"
libm = "0.2"

[target.'cfg(target_os = "vita")'.dependencies]
vita2d-sys = "0.1.1"
vitasdk-sys = { version = "0.3.3", features = ["SceGxm_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "ScePower_stub", "SceCtrl_stub", "SceDisplay_stub"] }

[features]
default = ["usb-debug"]
usb-debug = ["pocketjs-vita/usb-debug"]

[package.metadata.vita]
title_id = "PKTK00001"
title_name = "Pocket Tokyo"
build_std = "std,panic_abort"

[package.metadata.vita.profile.release]
strip_symbols = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
