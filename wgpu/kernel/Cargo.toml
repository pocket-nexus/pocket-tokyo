# The browser's device kernel for a Pocket3D game drawn with wgpu: the GPU
# device and the targets a frame goes to, pictures of 16 bits a texel, and
# ranges of a file over HTTP. Nothing here knows a game. It runs on the build
# machine too, for a frame written to a file.

[package]
name = "pocket-web-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wgpu device kernel for Pocket3D games in a browser tab: device and targets, 16-bit pictures, ranged reads"

[dependencies]
wgpu = { version = "25", default-features = false, features = ["webgpu", "wgsl", "metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "WorkerGlobalScope", "Request", "RequestInit", "Response", "Headers", "HtmlCanvasElement", "Performance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
